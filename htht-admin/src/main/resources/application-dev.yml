--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
  username: htht
  password: 123456

--- # 多源产品 ZIP 分片上传（开发环境）
# 开发机磁盘通常小于生产服务器，沿用生产环境 40 GB 解压上限和 20 GB
# 安全预留会导致 500 MB 级别的 ZIP 在创建会话时就被 409 拒绝。
# 生产环境仍使用 application.yml 中的更高安全阈值；如需更大 ZIP，
# 通过环境配置覆盖以下两个参数。
multisource:
  # 开发环境直接使用仓库内的算法 Worker 虚拟环境；生产环境仍通过环境变量覆盖。
  storage:
    # 多源数据运行目录与项目源码分离，避免开发盘被原始数据和处理产物占满。
    root: 'E:\RSImageProcessData\multisource'
  worker:
    command:
      - D:/work_space/RSImageProcess/JavaRSproject/rs-algorithm-worker/.venv/Scripts/rs-worker.exe
    # 显式指定 Worker 的工作与产物目录，避免与源码目录或上传源文件混用。
    work-root: 'E:\RSImageProcessData\multisource\tasks\work'
    artifact-root: 'E:\RSImageProcessData\multisource\tasks\artifacts'
    timeout: 10m
    stage-timeout: 2h
    processor-version: rs-algorithm-worker-0.1.0
  archive-upload:
    max-expanded-size-bytes: ${MULTISOURCE_ARCHIVE_MAX_EXPANDED_SIZE_BYTES:17179869184}
    safety-reserve-bytes: ${MULTISOURCE_ARCHIVE_SAFETY_RESERVE_BYTES:4294967296}

--- # powerjob 配置
powerjob:
  worker:
    # 如何开启调度中心请查看文档教程
    enabled: false
    # 需要先在 powerjob 登录页执行应用注册后才能使用
    app-name: htht-worker
    allow-lazy-connect-server: false
    max-appended-wf-context-length: 4096
    max-result-length: 4096
    # 28080 端口 随着主应用端口飘逸 避免集群冲突
    port: 2${server.port}
    protocol: http
    server-address: 127.0.0.1:7700
    store-strategy: disk

